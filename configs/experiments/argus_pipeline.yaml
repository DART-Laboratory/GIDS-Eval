schema_version: 2
kind: experiment
name: ARGUS modular pipeline
experiment_id: argus_modular
run_label: baseline
seed: 1337
python_bin: python3
stage_mode: symlink
manifests:
  - ../data/0501_oilrig.yaml
  - ../data/0501_sandworm.yaml
  - ../data/0501_wizard_spider.yaml
  - ../data/cic.yaml
  - ../data/lanl.yaml
  - ../data/optc.yaml
modules:
  graph_construction:
    runner: noop
    inputs:
      data_root/raw_data: ${input_root}/raw_data
    artifacts:
      data_root: data_root
  featurization:
    runner: shell_command
    inputs:
      data_root/raw_data: ${graph_construction_artifact_data_root}/raw_data
    workdir: ${runtime_root}/pre_processing/argus
    env:
      MIRAGE_INPUT_ROOT: ${module_output_dir}/data_root
    command:
      - bash
      - ${runtime_root}/pre_processing/argus/process_argus.sh
    artifacts:
      data_root: data_root
  graph_encoder:
    runner: noop
    inputs:
      data_root: ${featurization_artifact_data_root}
    artifacts:
      data_root: data_root
  temporal_encoder:
    runner: noop
    inputs:
      data_root: ${graph_encoder_artifact_data_root}
    artifacts:
      data_root: data_root
  loss:
    runner: noop
    inputs:
      data_root: ${temporal_encoder_artifact_data_root}
    artifacts:
      data_root: data_root
  detection:
    runner: command_group
    inputs:
      data_root: ${loss_artifact_data_root}
    artifacts:
      data_root: data_root
      results_root: results
      models_root: models
    jobs:
      - id: lanl
        dataset: lanl
        workdir: ${runtime_root}/detection_baselines/argus/LANL_OpTC
        command:
          - ${python_bin}
          - run.py
          - --dataset
          - LANL
          - --hidden
          - "32"
          - -z
          - "16"
          - --rnn
          - GRU
          - --delta
          - "1"
          - --lr
          - "0.01"
          - --fpweight
          - "0.6"
          - --epochs
          - "100"
          - --patience
          - "3"
        env:
          ARGUS_DATA_ROOT: ${module_output_dir}/data_root/argus
          ARGUS_RESULTS_ROOT: ${module_output_dir}/results
          ARGUS_MODELS_ROOT: ${module_output_dir}/models
          ARGUS_RUN_NAME: LANL
        metrics_relpath: results/LANL/metrics.csv
      - id: optc
        dataset: optc
        workdir: ${runtime_root}/detection_baselines/argus/LANL_OpTC
        command:
          - ${python_bin}
          - run.py
          - --dataset
          - OPTC
          - --hidden
          - "32"
          - -z
          - "16"
          - --rnn
          - GRU
          - --delta
          - "0.1"
          - --lr
          - "0.005"
          - --fpweight
          - "0.6"
          - --epochs
          - "100"
          - --patience
          - "10"
        env:
          ARGUS_DATA_ROOT: ${module_output_dir}/data_root/argus
          ARGUS_RESULTS_ROOT: ${module_output_dir}/results
          ARGUS_MODELS_ROOT: ${module_output_dir}/models
          ARGUS_RUN_NAME: OPTC
        metrics_relpath: results/OPTC/metrics.csv
      - id: cic
        dataset: cic
        workdir: ${runtime_root}/detection_baselines/argus/CIC
        command:
          - ${python_bin}
          - run.py
          - --dataset
          - O_cic
          - --delta
          - "15"
          - --lr
          - "0.01"
          - --hidden
          - "32"
          - -z
          - "16"
          - --fpweight
          - "0.46"
          - --epochs
          - "100"
          - --patience
          - "3"
        env:
          ARGUS_DATA_ROOT: ${module_output_dir}/data_root/argus
          ARGUS_RESULTS_ROOT: ${module_output_dir}/results
          ARGUS_MODELS_ROOT: ${module_output_dir}/models
          ARGUS_RUN_NAME: CIC
        metrics_relpath: results/CIC/metrics.csv
      - id: oilrig
        dataset: oilrig
        workdir: ${runtime_root}/detection_baselines/argus/0501
        command:
          - ${python_bin}
          - run.py
          - --dataset
          - O_oilrig
          - --hidden
          - "32"
          - -z
          - "16"
          - --rnn
          - GRU
          - --delta
          - "7.5"
          - --lr
          - "0.01"
          - --fpweight
          - "0.48"
          - --epochs
          - "100"
          - --patience
          - "5"
        env:
          ARGUS_DATA_ROOT: ${module_output_dir}/data_root/argus
          ARGUS_RESULTS_ROOT: ${module_output_dir}/results
          ARGUS_MODELS_ROOT: ${module_output_dir}/models
          ARGUS_RUN_NAME: oilrig
        metrics_relpath: results/oilrig/metrics.csv
      - id: sandworm
        dataset: sandworm
        workdir: ${runtime_root}/detection_baselines/argus/0501
        command:
          - ${python_bin}
          - run.py
          - --dataset
          - O_sandworm
          - --hidden
          - "16"
          - -z
          - "8"
          - --rnn
          - GRU
          - --delta
          - "2.5"
          - --lr
          - "0.0001"
          - --fpweight
          - "0.43"
          - --epochs
          - "100"
          - --patience
          - "3"
        env:
          ARGUS_DATA_ROOT: ${module_output_dir}/data_root/argus
          ARGUS_RESULTS_ROOT: ${module_output_dir}/results
          ARGUS_MODELS_ROOT: ${module_output_dir}/models
          ARGUS_RUN_NAME: sandworm
        metrics_relpath: results/sandworm/metrics.csv
      - id: wizard
        dataset: wizard
        workdir: ${runtime_root}/detection_baselines/argus/0501
        command:
          - ${python_bin}
          - run.py
          - --dataset
          - O_wizard
          - --hidden
          - "16"
          - -z
          - "8"
          - --rnn
          - GRU
          - --delta
          - "2.5"
          - --lr
          - "0.001"
          - --fpweight
          - "0.48"
          - --epochs
          - "100"
          - --patience
          - "3"
        env:
          ARGUS_DATA_ROOT: ${module_output_dir}/data_root/argus
          ARGUS_RESULTS_ROOT: ${module_output_dir}/results
          ARGUS_MODELS_ROOT: ${module_output_dir}/models
          ARGUS_RUN_NAME: wizard
        metrics_relpath: results/wizard/metrics.csv
