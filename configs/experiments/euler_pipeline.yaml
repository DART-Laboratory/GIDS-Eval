schema_version: 2
kind: experiment
name: EULER modular pipeline
experiment_id: euler_modular
run_label: baseline
seed: 1337
python_bin: python3
stage_mode: symlink
environment:
  CUDA_VISIBLE_DEVICES: ""
  TP_ENABLE_SHM: "0"
  TP_DISABLE_SHM: "1"
manifests:
  - ../data/0501_oilrig.yaml
  - ../data/0501_sandworm.yaml
  - ../data/0501_wizard_spider.yaml
  - ../data/cic.yaml
  - ../data/lanl.yaml
  - ../data/optc.yaml
modules:
  graph_construction:
    runner: noop
    inputs:
      data_root/raw_data: ${input_root}/raw_data
    artifacts:
      data_root: data_root
  featurization:
    runner: shell_command
    inputs:
      data_root/raw_data: ${graph_construction_artifact_data_root}/raw_data
    workdir: ${runtime_root}/pre_processing/euler
    env:
      MIRAGE_INPUT_ROOT: ${module_output_dir}/data_root
    command:
      - bash
      - ${runtime_root}/pre_processing/euler/process_euler.sh
    artifacts:
      data_root: data_root
  graph_encoder:
    runner: noop
    inputs:
      data_root: ${featurization_artifact_data_root}
    artifacts:
      data_root: data_root
  temporal_encoder:
    runner: noop
    inputs:
      data_root: ${graph_encoder_artifact_data_root}
    artifacts:
      data_root: data_root
  loss:
    runner: noop
    inputs:
      data_root: ${temporal_encoder_artifact_data_root}
    artifacts:
      data_root: data_root
  detection:
    runner: command_group
    inputs:
      data_root: ${loss_artifact_data_root}
    artifacts:
      data_root: data_root
      results_root: results
    jobs:
      - id: cic
        dataset: cic
        workdir: ${runtime_root}/detection_baselines/euler/CIC
        command:
          - ${python_bin}
          - run.py
          - --dataset
          - CIC
          - --delta
          - "50"
          - --workers
          - "4"
          - --threads
          - "1"
          - --lr
          - "0.005"
          - --fpweight
          - "0.7"
          - --patience
          - "5"
          - --tests
          - "1"
          - --tr-start
          - "0"
          - --tr-end
          - "50000"
          - --val-end
          - "55000"
        env:
          EULER_DATA_ROOT: ${module_output_dir}/data_root/euler
          EULER_RESULTS_ROOT: ${module_output_dir}/results
        metrics_relpath: results/cic/learning/metrics.csv
      - id: oilrig
        dataset: oilrig
        workdir: ${runtime_root}/detection_baselines/euler/0501
        command:
          - ${python_bin}
          - run.py
          - --dataset
          - oilrig
          - --delta
          - "2.5"
          - --workers
          - "4"
          - --threads
          - "1"
          - --lr
          - "0.005"
          - --fpweight
          - "0.48"
          - --tests
          - "1"
        env:
          EULER_DATA_ROOT: ${module_output_dir}/data_root/euler
          EULER_RESULTS_ROOT: ${module_output_dir}/results
        metrics_relpath: results/0501/oilrig/learning/metrics.csv
      - id: sandworm
        dataset: sandworm
        workdir: ${runtime_root}/detection_baselines/euler/0501
        command:
          - ${python_bin}
          - run.py
          - --dataset
          - sandworm
          - --delta
          - "2.5"
          - --workers
          - "4"
          - --threads
          - "1"
          - --lr
          - "0.005"
          - --fpweight
          - "0.42"
          - --tests
          - "1"
        env:
          EULER_DATA_ROOT: ${module_output_dir}/data_root/euler
          EULER_RESULTS_ROOT: ${module_output_dir}/results
        metrics_relpath: results/0501/sandworm/learning/metrics.csv
      - id: wizard
        dataset: wizard
        workdir: ${runtime_root}/detection_baselines/euler/0501
        command:
          - ${python_bin}
          - run.py
          - --dataset
          - wizard
          - --delta
          - "2.5"
          - --workers
          - "4"
          - --threads
          - "1"
          - --lr
          - "0.005"
          - --fpweight
          - "0.47"
          - --tests
          - "1"
        env:
          EULER_DATA_ROOT: ${module_output_dir}/data_root/euler
          EULER_RESULTS_ROOT: ${module_output_dir}/results
        metrics_relpath: results/0501/wizard/learning/metrics.csv
      - id: lanl
        dataset: lanl
        workdir: ${runtime_root}/detection_baselines/euler/LANL_OpTC
        command:
          - ${python_bin}
          - run.py
          - --dataset
          - LANL
          - --delta
          - "0.5"
          - --workers
          - "4"
          - --threads
          - "1"
          - --lr
          - "0.005"
          - --fpweight
          - "0.6"
          - --patience
          - "5"
          - --tests
          - "1"
        env:
          EULER_DATA_ROOT: ${module_output_dir}/data_root/euler
          EULER_RESULTS_ROOT: ${module_output_dir}/results
        metrics_relpath: results/lanl/learning/metrics.csv
      - id: optc
        dataset: optc
        workdir: ${runtime_root}/detection_baselines/euler/LANL_OpTC
        command:
          - ${python_bin}
          - run.py
          - --dataset
          - OPTC
          - --delta
          - "2.5"
          - --workers
          - "4"
          - --threads
          - "1"
          - --rnn
          - LSTM
          - --lr
          - "0.005"
          - --fpweight
          - "0.6"
          - --patience
          - "5"
          - --tests
          - "1"
        env:
          EULER_DATA_ROOT: ${module_output_dir}/data_root/euler
          EULER_RESULTS_ROOT: ${module_output_dir}/results
        metrics_relpath: results/optc/learning/metrics.csv
