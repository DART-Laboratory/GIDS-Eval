schema_version: 2
kind: experiment
name: Anomal-E modular pipeline
experiment_id: anomal_modular
run_label: baseline
seed: 1337
python_bin: python3
stage_mode: symlink
manifests:
  - ../data/0501_oilrig.yaml
  - ../data/0501_sandworm.yaml
  - ../data/0501_wizard_spider.yaml
  - ../data/cic.yaml
modules:
  graph_construction:
    runner: noop
    inputs:
      data_root/raw_data: ${input_root}/raw_data
    artifacts:
      data_root: data_root
  featurization:
    runner: shell_command
    inputs:
      data_root/raw_data: ${graph_construction_artifact_data_root}/raw_data
    workdir: ${runtime_root}/pre_processing/anomal
    env:
      MIRAGE_INPUT_ROOT: ${module_output_dir}/data_root
    command:
      - bash
      - ${runtime_root}/pre_processing/anomal/process_anomal.sh
    artifacts:
      data_root: data_root
  graph_encoder:
    runner: noop
    inputs:
      data_root: ${featurization_artifact_data_root}
    artifacts:
      data_root: data_root
  temporal_encoder:
    runner: noop
    inputs:
      data_root: ${graph_encoder_artifact_data_root}
    artifacts:
      data_root: data_root
  loss:
    runner: noop
    inputs:
      data_root: ${temporal_encoder_artifact_data_root}
    artifacts:
      data_root: data_root
  detection:
    runner: command_group
    inputs:
      data_root: ${loss_artifact_data_root}
    artifacts:
      data_root: data_root
      results_root: results
      models_root: models
    jobs:
      - id: cic
        dataset: cic
        workdir: ${runtime_root}/detection_baselines/anomal/CIC
        command:
          - ${python_bin}
          - run.py
          - --dataset
          - cic
        env:
          ANOMAL_DATA_ROOT: ${module_output_dir}/data_root/anomal
          ANOMAL_RESULTS_ROOT: ${module_output_dir}/results
          ANOMAL_MODELS_ROOT: ${module_output_dir}/models
          ANOMAL_RUN_NAME: CIC
        metrics_relpath: results/CIC/metrics.csv
      - id: oilrig
        dataset: oilrig
        workdir: ${runtime_root}/detection_baselines/anomal/0501
        command:
          - ${python_bin}
          - run.py
          - --dataset
          - oilrig
        env:
          ANOMAL_DATA_ROOT: ${module_output_dir}/data_root/anomal
          ANOMAL_RESULTS_ROOT: ${module_output_dir}/results
          ANOMAL_MODELS_ROOT: ${module_output_dir}/models
          ANOMAL_RUN_NAME: oilrig
        metrics_relpath: results/oilrig/metrics.csv
      - id: sandworm
        dataset: sandworm
        workdir: ${runtime_root}/detection_baselines/anomal/0501
        command:
          - ${python_bin}
          - run.py
          - --dataset
          - sandworm
        env:
          ANOMAL_DATA_ROOT: ${module_output_dir}/data_root/anomal
          ANOMAL_RESULTS_ROOT: ${module_output_dir}/results
          ANOMAL_MODELS_ROOT: ${module_output_dir}/models
          ANOMAL_RUN_NAME: sandworm
        metrics_relpath: results/sandworm/metrics.csv
      - id: wizard
        dataset: wizard
        workdir: ${runtime_root}/detection_baselines/anomal/0501
        command:
          - ${python_bin}
          - run.py
          - --dataset
          - wizard
        env:
          ANOMAL_DATA_ROOT: ${module_output_dir}/data_root/anomal
          ANOMAL_RESULTS_ROOT: ${module_output_dir}/results
          ANOMAL_MODELS_ROOT: ${module_output_dir}/models
          ANOMAL_RUN_NAME: wizard
        metrics_relpath: results/wizard/metrics.csv
