schema_version: 1
name: ARGUS baseline
detector: argus
run_label: baseline
seed: 1337
python_bin: python3
stage_mode: symlink
manifests:
  - ../data/0501_oilrig.yaml
  - ../data/0501_sandworm.yaml
  - ../data/0501_wizard_spider.yaml
  - ../data/cic.yaml
  - ../data/lanl.yaml
  - ../data/optc.yaml
preprocess:
  enabled: true
  workdir: ${runtime_root}/pre_processing/argus
  command:
    - bash
    - ${runtime_root}/pre_processing/argus/process_argus.sh
jobs:
  - id: lanl
    dataset: lanl
    workdir: ${runtime_root}/detection_baselines/argus/LANL_OpTC
    command:
      - ${python_bin}
      - run.py
      - --dataset
      - LANL
      - --hidden
      - "32"
      - -z
      - "16"
      - --rnn
      - GRU
      - --delta
      - "1"
      - --lr
      - "0.01"
      - --fpweight
      - "0.6"
      - --epochs
      - "100"
      - --patience
      - "3"
    env:
      ARGUS_DATA_ROOT: ${input_root}/argus
      ARGUS_RESULTS_ROOT: ${output_root}/argus/results
      ARGUS_MODELS_ROOT: ${output_root}/argus/models
      ARGUS_RUN_NAME: LANL
    metrics_path: ${output_root}/argus/results/LANL/metrics.csv
  - id: optc
    dataset: optc
    workdir: ${runtime_root}/detection_baselines/argus/LANL_OpTC
    command:
      - ${python_bin}
      - run.py
      - --dataset
      - OPTC
      - --hidden
      - "32"
      - -z
      - "16"
      - --rnn
      - GRU
      - --delta
      - "0.1"
      - --lr
      - "0.005"
      - --fpweight
      - "0.6"
      - --epochs
      - "100"
      - --patience
      - "10"
    env:
      ARGUS_DATA_ROOT: ${input_root}/argus
      ARGUS_RESULTS_ROOT: ${output_root}/argus/results
      ARGUS_MODELS_ROOT: ${output_root}/argus/models
      ARGUS_RUN_NAME: OPTC
    metrics_path: ${output_root}/argus/results/OPTC/metrics.csv
  - id: cic
    dataset: cic
    workdir: ${runtime_root}/detection_baselines/argus/CIC
    command:
      - ${python_bin}
      - run.py
      - --dataset
      - O_cic
      - --delta
      - "15"
      - --lr
      - "0.01"
      - --hidden
      - "32"
      - -z
      - "16"
      - --fpweight
      - "0.46"
      - --epochs
      - "100"
      - --patience
      - "3"
    env:
      ARGUS_DATA_ROOT: ${input_root}/argus
      ARGUS_RESULTS_ROOT: ${output_root}/argus/results
      ARGUS_MODELS_ROOT: ${output_root}/argus/models
      ARGUS_RUN_NAME: CIC
    metrics_path: ${output_root}/argus/results/CIC/metrics.csv
  - id: oilrig
    dataset: oilrig
    workdir: ${runtime_root}/detection_baselines/argus/0501
    command:
      - ${python_bin}
      - run.py
      - --dataset
      - O_oilrig
      - --hidden
      - "32"
      - -z
      - "16"
      - --rnn
      - GRU
      - --delta
      - "7.5"
      - --lr
      - "0.01"
      - --fpweight
      - "0.48"
      - --epochs
      - "100"
      - --patience
      - "5"
    env:
      ARGUS_DATA_ROOT: ${input_root}/argus
      ARGUS_RESULTS_ROOT: ${output_root}/argus/results
      ARGUS_MODELS_ROOT: ${output_root}/argus/models
      ARGUS_RUN_NAME: oilrig
    metrics_path: ${output_root}/argus/results/oilrig/metrics.csv
  - id: sandworm
    dataset: sandworm
    workdir: ${runtime_root}/detection_baselines/argus/0501
    command:
      - ${python_bin}
      - run.py
      - --dataset
      - O_sandworm
      - --hidden
      - "16"
      - -z
      - "8"
      - --rnn
      - GRU
      - --delta
      - "2.5"
      - --lr
      - "0.0001"
      - --fpweight
      - "0.43"
      - --epochs
      - "100"
      - --patience
      - "3"
    env:
      ARGUS_DATA_ROOT: ${input_root}/argus
      ARGUS_RESULTS_ROOT: ${output_root}/argus/results
      ARGUS_MODELS_ROOT: ${output_root}/argus/models
      ARGUS_RUN_NAME: sandworm
    metrics_path: ${output_root}/argus/results/sandworm/metrics.csv
  - id: wizard
    dataset: wizard
    workdir: ${runtime_root}/detection_baselines/argus/0501
    command:
      - ${python_bin}
      - run.py
      - --dataset
      - O_wizard
      - --hidden
      - "16"
      - -z
      - "8"
      - --rnn
      - GRU
      - --delta
      - "2.5"
      - --lr
      - "0.001"
      - --fpweight
      - "0.48"
      - --epochs
      - "100"
      - --patience
      - "3"
    env:
      ARGUS_DATA_ROOT: ${input_root}/argus
      ARGUS_RESULTS_ROOT: ${output_root}/argus/results
      ARGUS_MODELS_ROOT: ${output_root}/argus/models
      ARGUS_RUN_NAME: wizard
    metrics_path: ${output_root}/argus/results/wizard/metrics.csv
