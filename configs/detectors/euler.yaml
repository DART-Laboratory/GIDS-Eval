schema_version: 1
name: EULER baseline
detector: euler
run_label: baseline
seed: 1337
python_bin: python3
stage_mode: symlink
environment:
  CUDA_VISIBLE_DEVICES: ""
  TP_ENABLE_SHM: "0"
  TP_DISABLE_SHM: "1"
manifests:
  - ../data/0501_oilrig.yaml
  - ../data/0501_sandworm.yaml
  - ../data/0501_wizard_spider.yaml
  - ../data/cic.yaml
  - ../data/lanl.yaml
  - ../data/optc.yaml
preprocess:
  enabled: true
  workdir: ${runtime_root}/pre_processing/euler
  command:
    - bash
    - ${runtime_root}/pre_processing/euler/process_euler.sh
jobs:
  - id: cic
    dataset: cic
    workdir: ${runtime_root}/detection_baselines/euler/CIC
    command:
      - ${python_bin}
      - run.py
      - --dataset
      - CIC
      - --delta
      - "50"
      - --workers
      - "4"
      - --threads
      - "1"
      - --lr
      - "0.005"
      - --fpweight
      - "0.7"
      - --patience
      - "5"
      - --tests
      - "1"
      - --tr-start
      - "0"
      - --tr-end
      - "50000"
      - --val-end
      - "55000"
    env:
      EULER_DATA_ROOT: ${input_root}/euler
      EULER_RESULTS_ROOT: ${output_root}/euler/results
    metrics_path: ${output_root}/euler/results/cic/learning/metrics.csv
  - id: oilrig
    dataset: oilrig
    workdir: ${runtime_root}/detection_baselines/euler/0501
    command:
      - ${python_bin}
      - run.py
      - --dataset
      - oilrig
      - --delta
      - "2.5"
      - --workers
      - "4"
      - --threads
      - "1"
      - --lr
      - "0.005"
      - --fpweight
      - "0.48"
      - --tests
      - "1"
    env:
      EULER_DATA_ROOT: ${input_root}/euler
      EULER_RESULTS_ROOT: ${output_root}/euler/results
    metrics_path: ${output_root}/euler/results/0501/oilrig/learning/metrics.csv
  - id: sandworm
    dataset: sandworm
    workdir: ${runtime_root}/detection_baselines/euler/0501
    command:
      - ${python_bin}
      - run.py
      - --dataset
      - sandworm
      - --delta
      - "2.5"
      - --workers
      - "4"
      - --threads
      - "1"
      - --lr
      - "0.005"
      - --fpweight
      - "0.42"
      - --tests
      - "1"
    env:
      EULER_DATA_ROOT: ${input_root}/euler
      EULER_RESULTS_ROOT: ${output_root}/euler/results
    metrics_path: ${output_root}/euler/results/0501/sandworm/learning/metrics.csv
  - id: wizard
    dataset: wizard
    workdir: ${runtime_root}/detection_baselines/euler/0501
    command:
      - ${python_bin}
      - run.py
      - --dataset
      - wizard
      - --delta
      - "2.5"
      - --workers
      - "4"
      - --threads
      - "1"
      - --lr
      - "0.005"
      - --fpweight
      - "0.47"
      - --tests
      - "1"
    env:
      EULER_DATA_ROOT: ${input_root}/euler
      EULER_RESULTS_ROOT: ${output_root}/euler/results
    metrics_path: ${output_root}/euler/results/0501/wizard/learning/metrics.csv
  - id: lanl
    dataset: lanl
    workdir: ${runtime_root}/detection_baselines/euler/LANL_OpTC
    command:
      - ${python_bin}
      - run.py
      - --dataset
      - LANL
      - --delta
      - "0.5"
      - --workers
      - "4"
      - --threads
      - "1"
      - --lr
      - "0.005"
      - --fpweight
      - "0.6"
      - --patience
      - "5"
      - --tests
      - "1"
    env:
      EULER_DATA_ROOT: ${input_root}/euler
      EULER_RESULTS_ROOT: ${output_root}/euler/results
    metrics_path: ${output_root}/euler/results/lanl/learning/metrics.csv
  - id: optc
    dataset: optc
    workdir: ${runtime_root}/detection_baselines/euler/LANL_OpTC
    command:
      - ${python_bin}
      - run.py
      - --dataset
      - OPTC
      - --delta
      - "2.5"
      - --workers
      - "4"
      - --threads
      - "1"
      - --rnn
      - LSTM
      - --lr
      - "0.005"
      - --fpweight
      - "0.6"
      - --patience
      - "5"
      - --tests
      - "1"
    env:
      EULER_DATA_ROOT: ${input_root}/euler
      EULER_RESULTS_ROOT: ${output_root}/euler/results
    metrics_path: ${output_root}/euler/results/optc/learning/metrics.csv
