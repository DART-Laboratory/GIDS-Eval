name: euler
channels:
  - pytorch
  - defaults
dependencies:
  - python=3.10
  - pip
  - cpuonly
  - pytorch=1.13.1
  - torchvision=0.14.1
  - torchaudio=0.13.1
  - numpy=1.23.5
  - pandas=1.4.3
  - scikit-learn=1.1.1
  - scipy=1.9.3
  - tqdm
  - requests
  - psutil
  - joblib
  - pillow
  - bottleneck
  - numexpr
  - mkl
  - mkl-service
  - mkl_fft
  - mkl_random
  - certifi
  - cffi
  - cryptography
  - jinja2
  - markupsafe
  - pyopenssl
  - pysocks
  - setuptools
  - six
  - typing_extensions
  - wheel
  - yaml
  - pip:
      - docopt==0.6.2
      - pipreqs==0.4.13
      - pyyaml==6.0
      - yarg==0.1.9
      - torch-geometric==2.2.0
